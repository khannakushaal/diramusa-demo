@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

.imp{
  --ink:#0E1524; --ink-2:#172238; --ink-3:#1F2C46;
  --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.15);
  --paper:#FFFFFF; --paper-2:#F3F5FA; --paper-3:#E7EBF4; --line:#E2E7F1;
  --text:#141B2E; --text-2:#56627B; --text-3:#8A95AD;
  --inv:#F4F7FE; --inv-2:#9AA6C2;
  --iris:#5B4FE3; --iris-2:#7C70F0; --iris-soft:rgba(91,79,227,.12);
  --mint:#2FBE63; --mint-2:#1FA050; --mint-soft:rgba(47,190,99,.15);
  --amber:#E8920C; --amber-soft:rgba(232,146,12,.14);
  --rose:#EE3D5A; --rose-soft:rgba(238,61,90,.12);
  --cyan:#2FD3E1;
  --r:18px;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.imp *{box-sizing:border-box;margin:0;padding:0}
.imp button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.disp{font-family:'Archivo','Inter',sans-serif;letter-spacing:-.01em}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* stage */
.stage{height:100dvh;min-height:100dvh;
   background-color:#EDEFF4;
   background-image:radial-gradient(rgba(20,27,46,.07) 1px, transparent 1.4px);
   background-size:22px 22px;
   padding:12px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.deck{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.caption{flex:0 0 auto;font-size:11.5px;color:var(--text-2);text-align:center;max-width:560px;margin:0 auto;line-height:1.4}

/* control bar */
.topbar{flex:0 0 auto;width:min(980px,96vw);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,#3ED27D,#21A455);
  display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(33,164,85,.55)}
.wordmark{font-family:'Archivo';font-weight:800;font-style:italic;text-transform:uppercase;font-size:18px;letter-spacing:0;color:var(--text)}
.wordmark span{color:var(--mint);font-weight:800;font-style:italic}
.tagline{font-size:11.5px;color:var(--text-2);margin-top:1px}
.roleseg{display:flex;background:rgba(255,255,255,.7);border:1px solid var(--line);padding:4px;border-radius:13px;gap:3px;
  backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(20,30,60,.05)}
.roletab{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;
  color:var(--text-2);transition:all .18s ease;min-height:40px}
.roletab[data-on="1"]{background:var(--ink);color:var(--inv);box-shadow:0 6px 16px -6px rgba(11,16,32,.5)}
.roletab:focus-visible{outline:2px solid var(--iris);outline-offset:2px}

/* phone */
.phone{width:384px;height:788px;flex:0 0 auto;background:#05070E;border-radius:46px;padding:11px;
  box-shadow:0 40px 80px -30px rgba(13,20,45,.55),0 0 0 1px rgba(0,0,0,.04);position:relative}
.screen{position:relative;width:100%;height:100%;background:var(--ink);border-radius:36px;overflow:hidden}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;z-index:60;font-size:13px;font-weight:600;pointer-events:none}
.statusbar .r{display:flex;gap:6px;align-items:center}
.bars{display:flex;gap:2px;align-items:flex-end;height:11px}
.bars i{width:3px;background:currentColor;border-radius:1px}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;
  background:rgba(255,255,255,.85);z-index:60}
.screen[data-light="1"] .homebar{background:rgba(11,16,32,.3)}

/* map */
.mapwrap{position:absolute;inset:0}
.mapwrap svg{width:100%;height:100%;display:block;transition:transform .25s ease}
.mapctrl{position:absolute;top:118px;right:13px;display:flex;flex-direction:column;gap:10px;z-index:24}
.gbtn{width:40px;height:40px;border-radius:9px;background:#fff;border:1px solid rgba(0,0,0,.06);display:grid;place-items:center;
  color:#3C4043;box-shadow:0 1px 4px rgba(0,0,0,.28);transition:transform .12s,background .15s}
.gbtn:active{transform:scale(.93)}
.gbtn:hover{background:#F8F9FA}
.gbtn:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.compass{border-radius:50%}
.mapzoom{display:flex;flex-direction:column;border-radius:9px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.mapzoom .gbtn{border-radius:0;box-shadow:none;border-left:1px solid rgba(0,0,0,.06);border-right:1px solid rgba(0,0,0,.06)}
.mapzoom .gbtn:first-child{border-top:1px solid rgba(0,0,0,.06)}
.mapzoom .gbtn+.gbtn{border-top:1px solid rgba(0,0,0,.08)}
.side-group{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--inv-2);font-weight:700;padding:13px 10px 5px;flex:0 0 auto}
.route{fill:none;stroke:url(#rg);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.routeflow{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 16;opacity:.55;
  animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}

/* bottom sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:26px 26px 0 0;z-index:40;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px -20px rgba(13,20,45,.4);
  max-height:calc(100% - 36px);overflow-y:auto;overscroll-behavior:contain;
  animation:sheetin .34s cubic-bezier(.22,1,.36,1)}
.sheet::-webkit-scrollbar{width:0;height:0}
.sheet-tab{bottom:74px;max-height:calc(100% - 110px)}
.backbtn{position:absolute;z-index:38;width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--text);box-shadow:0 4px 14px -6px rgba(13,20,45,.35);transition:transform .12s}
.backbtn:active{transform:scale(.92)}
.backbtn:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.auth{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.auth-hero{flex:0 0 auto;padding:74px 24px 26px;background:linear-gradient(160deg,#11193A 0%,#1B1146 60%,#241356 100%);color:#fff;
  border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.auth-hero .glow{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(108,92,231,.55),transparent 70%);top:-60px;right:-40px}
.auth-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:22px 24px}
.field{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--paper);margin-bottom:11px}
.field:focus-within{border-color:var(--iris)}
.field input{border:none;outline:none;font:inherit;font-size:15.5px;width:100%;background:transparent;color:var(--text)}
.social{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;border-radius:13px;border:1.5px solid var(--line);
  background:#fff;font-weight:600;font-size:14.5px;color:var(--text);transition:transform .12s,background .15s}
.social:active{transform:scale(.98)}
.social:hover{background:var(--paper-2)}
.orline{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:12px;margin:16px 0}
.orline::before,.orline::after{content:"";height:1px;background:var(--line);flex:1}
.reqcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px;border-radius:15px;border:1px solid var(--line);
  background:var(--paper);margin-bottom:9px;transition:transform .12s}
.reqcard:active{transform:scale(.99)}
@keyframes sheetin{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.grab{width:38px;height:4px;border-radius:3px;background:var(--paper-3);margin:0 auto 14px}

/* generic ui */
.row{display:flex;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;
  border-radius:14px;font-weight:600;font-size:15px;transition:transform .12s ease,filter .15s,background .15s;
  background:var(--paper-3);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.btn-pri{background:var(--ink);color:var(--inv)}
.btn-iris{background:var(--iris);color:#fff;box-shadow:0 10px 22px -10px rgba(108,92,231,.8)}
.btn-block{width:100%}
.btn-lg{min-height:54px;font-size:16px;border-radius:16px}
.icb{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--paper-2);
  color:var(--text);transition:transform .12s,background .15s;border:1px solid var(--line)}
.icb:active{transform:scale(.94)}
.icb:focus-visible{outline:2px solid var(--iris);outline-offset:2px}

.searchbar{display:flex;align-items:center;gap:11px;background:var(--paper);border:1px solid var(--line);
  border-radius:15px;padding:14px 15px;width:100%;text-align:left;box-shadow:0 6px 18px -10px rgba(13,20,45,.3)}
.searchbar .ph{color:var(--text-2);font-weight:500;font-size:15.5px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:11px;background:var(--paper-2);
  border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--text);min-height:40px}
.chip:active{transform:scale(.96)}

.tier{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px;border-radius:16px;
  border:1.5px solid var(--line);background:var(--paper);transition:all .16s;margin-bottom:9px}
.tier[data-sel="1"]{border-color:var(--iris);background:var(--iris-soft);box-shadow:0 8px 22px -12px rgba(108,92,231,.5)}
.tier:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
.tier-ic{width:50px;height:50px;border-radius:13px;background:var(--paper-2);display:grid;place-items:center;flex:0 0 auto}
.tier[data-sel="1"] .tier-ic{background:#fff}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.muted{color:var(--text-2)}
.divider{height:1px;background:var(--line);margin:12px 0}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:11.5px;font-weight:600}
.b-mint{background:var(--mint-soft);color:var(--mint)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-iris{background:var(--iris-soft);color:var(--iris)}
.b-rose{background:var(--rose-soft);color:var(--rose)}

.ping-wrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.radar{width:150px;height:150px;border-radius:50%;position:relative}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0%,rgba(108,92,231,.45) 30%,transparent 38%);animation:spin 1.8s linear infinite}
.radar i{position:absolute;inset:0;margin:auto;width:14px;height:14px;border-radius:50%;background:var(--iris);
  box-shadow:0 0 0 0 rgba(108,92,231,.5);animation:pulse 1.6s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(108,92,231,.5)}100%{box-shadow:0 0 0 46px rgba(108,92,231,0)}}

.dcard{display:flex;align-items:center;gap:13px}
.avatar{width:54px;height:54px;border-radius:15px;background:linear-gradient(150deg,#2A3354,#19223A);display:grid;place-items:center;
  color:var(--inv);font-family:'Archivo';font-weight:700;font-size:20px;flex:0 0 auto}

.otp{display:flex;gap:9px;justify-content:center}
.otp b{width:46px;height:56px;border-radius:13px;background:var(--ink);color:var(--inv);display:grid;place-items:center;
  font-family:'JetBrains Mono';font-size:24px;font-weight:600}

.star{transition:transform .1s}
.star:active{transform:scale(.85)}

.toggle{width:100%;border-radius:22px;padding:20px;display:flex;align-items:center;justify-content:space-between;
  transition:all .25s;border:1px solid}
.toggle[data-on="0"]{background:var(--ink-2);border-color:var(--hair)}
.toggle[data-on="1"]{background:linear-gradient(150deg,var(--mint),var(--mint-2));border-color:transparent;
  box-shadow:0 16px 36px -16px rgba(16,183,149,.8)}
.knob{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.toggle[data-on="1"] .knob{background:rgba(255,255,255,.22)}

.dispatch{position:absolute;left:14px;right:14px;bottom:80px;background:var(--paper);border-radius:22px;z-index:45;
  padding:18px;box-shadow:0 24px 60px -24px rgba(13,20,45,.6);animation:rise .4s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}

.tabbar{position:absolute;bottom:0;left:0;right:0;height:74px;background:var(--paper);border-top:1px solid var(--line);
  display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;
  color:var(--text-3);padding-top:8px}
.tab[data-on="1"]{color:var(--iris)}

.dark-screen{position:absolute;inset:0;background:var(--ink);color:var(--inv);display:flex;flex-direction:column}
.dark-card{background:var(--ink-2);border:1px solid var(--hair);border-radius:18px;padding:16px;color:var(--inv)}

/* ===== admin browser ===== */
.browser{width:min(980px,96vw);height:648px;max-height:100%;background:var(--paper);border-radius:18px;overflow:hidden;
  box-shadow:0 40px 80px -34px rgba(13,20,45,.5),0 0 0 1px var(--line);display:flex;flex-direction:column}
.chrome{height:46px;background:var(--paper-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;flex:0 0 auto}
.dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%}
.url{flex:1;height:28px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;
  padding:0 12px;font-size:12.5px;color:var(--text-2);max-width:340px}
.admin{flex:1;display:flex;min-height:0}
.side{width:220px;flex:0 0 auto;background:var(--ink);color:var(--inv);padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0}
.side::-webkit-scrollbar{width:7px}
.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
.side::-webkit-scrollbar-track{background:transparent}
.side .nav-i{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;font-size:13.5px;font-weight:600;
  color:var(--inv-2);transition:all .15s;text-align:left;width:100%;min-height:44px;flex:0 0 auto}
.side .nav-i[data-on="1"]{background:var(--iris);color:#fff}
.side .nav-i:hover{color:var(--inv)}
.side .nav-i[data-on="1"]:hover{color:#fff}
.content{flex:1;min-width:0;background:var(--paper-2);overflow:auto;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.cmd-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.fin-kpis{grid-template-columns:repeat(3,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.qrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:none}
.mobnav{display:none;position:relative;background:var(--ink);padding:10px 12px}
.mobnav .mobsel{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:var(--ink-2);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:13px;
  padding:12px 14px;font-size:14px;font-family:inherit}
.mobnav .mobsel span{color:#fff}
.mobmenu-scrim{position:fixed;inset:0;z-index:40}
.mobmenu{position:absolute;left:12px;right:12px;top:62px;z-index:41;
  background:var(--ink-2);border:1px solid rgba(255,255,255,.14);border-radius:14px;
  padding:8px;max-height:62vh;overflow-y:auto;box-shadow:0 24px 50px -16px rgba(0,0,0,.6)}
.mobmenu::-webkit-scrollbar{width:7px}
.mobmenu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
.mobmenu-group{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8A95AD;
  font-weight:700;padding:11px 10px 4px}
.mobnav .mobmenu-i{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  color:#E3E8F2;background:transparent;border-radius:10px;padding:12px;
  font-size:13.5px;font-weight:600;font-family:inherit}
.mobnav .mobmenu-i span{color:inherit}
.mobnav .mobmenu-i[data-on="1"]{background:var(--iris);color:#fff}
@media (max-width:700px){
  .url{display:none}
  .admin{flex-direction:column}
  .side{display:none}
  .mobnav{display:block}
  .content{padding:15px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cmd-grid{grid-template-columns:1fr}
  .fin-kpis{grid-template-columns:repeat(2,1fr)}
  .vrow{flex-wrap:wrap}
  .vrow>.row:last-child{width:100%;justify-content:flex-end;margin-top:4px}
}
@media (max-width:520px){
  .topbar{flex-direction:column;gap:9px}
  .brand{align-self:flex-start}
  .roleseg{width:100%}
  .roletab{flex:1;justify-content:center;padding:9px 6px;font-size:13px}
  .caption{display:none}
}

.scroll{overflow:auto}
.scroll::-webkit-scrollbar{width:0;height:0}

@media (prefers-reduced-motion:reduce){
  .imp *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.05ms !important}
}
